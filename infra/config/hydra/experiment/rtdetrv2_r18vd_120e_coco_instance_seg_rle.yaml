# @package _global_

model:
  source_root: raw_models/RT-DETR/rtdetrv2_pytorch
  official_config_path: configs/rtdetrv2/rtdetrv2_r18vd_120e_coco_instance_seg_rle.yml
  variant: r18
  num_classes: 80
  num_queries: 300
  hidden_dim: 256
  dn_num_group: 5
  sync_bn: true

train:
  epochs: 120
  batch_size: 8
  val_batch_size: 8
  num_workers: 4
  lr: 0.0002
  backbone_lr_multiplier: 1.25
  weight_decay: 0.0001
  grad_clip_norm: 0.1
  mixed_precision: fp16
  output_dir: ./nn_framework/outputs
  log_every_n_steps: 20
  val_every_n_epochs: 1
  save_every_n_epochs: 1
  use_ema: true
  ema_decay: 0.9999
  ema_warmup_updates: 2000
  seed: 42

data:
  filter_empty_targets: true
  keep_rle_in_targets: true
  task: detection
  evaluator:
    type: CocoEvaluator
    iou_types: [bbox, segm]
  num_classes: 80
  remap_mscoco_category: true
  mapping:
    0: 4

  label2classid: &label2classid
    0: person
    1: bicycle
    2: car
    3: motorcycle
    4: airplane
    5: bus
    6: train
    7: truck
    8: boat
    9: traffic light
    10: fire hydrant
    11: stop sign
    12: parking meter
    13: bench
    14: bird
    15: cat
    16: dog
    17: horse
    18: sheep
    19: cow
    20: elephant
    21: bear
    22: zebra
    23: giraffe
    24: backpack
    25: umbrella
    26: handbag
    27: tie
    28: suitcase
    29: frisbee
    30: skis
    31: snowboard
    32: sports ball
    33: kite
    34: baseball bat
    35: baseball glove
    36: skateboard
    37: surfboard
    38: tennis racket
    39: bottle
    40: wine glass
    41: cup
    42: fork
    43: knife
    44: spoon
    45: bowl
    46: banana
    47: apple
    48: sandwich
    49: orange
    50: broccoli
    51: carrot
    52: hot dog
    53: pizza
    54: donut
    55: cake
    56: chair
    57: couch
    58: potted plant
    59: bed
    60: dining table
    61: toilet
    62: tv
    63: laptop
    64: mouse
    65: remote
    66: keyboard
    67: cell phone
    68: microwave
    69: oven
    70: toaster
    71: sink
    72: refrigerator
    73: book
    74: clock
    75: vase
    76: scissors
    77: teddy bear
    78: hair drier
    79: toothbrush

  class_id_to_name: *label2classid

  train_dataloader:
    type: DataLoader
    dataset:
      type: CocoDetection
      datasets:
        - img_folder: /home/ronbar/Desktop/repo/datasets/drone-dataset-(uav)-DatasetNinja/train/img
          ann_file: /home/ronbar/Desktop/repo/datasets/drone-dataset-(uav)-DatasetNinja/instances_train.json
      return_masks: true
      transforms:
        type: Compose
        ops:
          - {type: RandomHorizontalFlip, p: 0.5}
          - {type: RandomVerticalFlip, p: 0.2}
          - {type: Rotate, limit: 15, p: 0.3}
          - {type: HueSaturationValue, hue_shift_limit: 12, sat_shift_limit: 24, val_shift_limit: 12, p: 0.3}
          - {type: RandomBrightnessContrast, p: 0.3}
          - {type: Resize, size: [640, 640]}
          - {type: ConvertPILImage, dtype: 'float32', scale: true}
          - {type: ConvertBoxes, fmt: 'cxcywh', normalize: true}
        policy:
          name: stop_epoch
          epoch: 71
          ops: ['RandomVerticalFlip', 'Rotate', 'HueSaturationValue', 'RandomBrightnessContrast']
    shuffle: true
    num_workers: 2
    total_batch_size: 2
    drop_last: true
    collate_fn:
      type: BatchImageCollateFunction
      scales: [480, 512, 544, 576, 608, 640, 640, 640, 672, 704, 736, 768, 800]
      stop_epoch: 71

  val_dataloader:
    type: DataLoader
    dataset:
      type: CocoDetection
      datasets:
        - img_folder: /home/ronbar/Desktop/repo/datasets/drone-dataset-(uav)-DatasetNinja/valid/img
          ann_file: /home/ronbar/Desktop/repo/datasets/drone-dataset-(uav)-DatasetNinja/instances_valid.json
      return_masks: true
      transforms:
        type: Compose
        ops:
          - {type: Resize, size: [640, 640]}
          - {type: ConvertPILImage, dtype: 'float32', scale: true}
    shuffle: false
    num_workers: 2
    total_batch_size: 2
    drop_last: false
    collate_fn:
      type: BatchImageCollateFunction

runtime:
  common:
    model_profile: r18
    output_dir: out
    device: cuda
    batch_size: 1
    num_workers: 2
    use_gpu: true
    use_xpu: false
    use_mlu: false
    use_npu: false
    log_iter: 20
    snapshot_epoch: 1
    print_flops: false
    print_params: false
    epoches: 120

  data_preparation:
    prepare_data: false
    supervisely_dataset_root: null
    supervisely_splits: [train, valid]
    ann_subdir: ann
    img_subdir: img
    wandb_project: null
    wandb_run_name: null

  export:
    post_process: true
    nms: true
    benchmark: false
    fuse_conv_bn: false

  actions:
    train: {}

    eval:
      checkpoint: /home/ronbar/repo/nn_framework/raw_models/RT-DETR/rtdetrv2_pytorch/weights/rtdetrv2_r18vd_120e_coco_rerun_48.1.pth

    inference:
      checkpoint: /home/ronbar/repo/nn_framework/raw_models/RT-DETR/rtdetrv2_pytorch/weights/rtdetrv2_r18vd_120e_coco_rerun_48.1.pth
      input_dir: /home/ronbar/repo/nn_framework/input_data

    inference_onnx:
      onnx_model: /home/ronbar/repo/nn_framework/raw_models/RT-DETR/rtdetrv2_pytorch/exported_models/model.onnx
      input_dir: /home/ronbar/repo/nn_framework/input_data

    export_onnx:
      checkpoint: /home/ronbar/repo/nn_framework/raw_models/RT-DETR/rtdetrv2_pytorch/weights/rtdetrv2_r18vd_120e_coco_rerun_48.1.pth
      onnx_model: /home/ronbar/repo/nn_framework/raw_models/RT-DETR/rtdetrv2_pytorch/exported_models/model.onnx

    export_coco_rle:
      dataset_root: /home/ronbar/Desktop/repo/datasets/drone-dataset-(uav)-DatasetNinja
      output_dir: /home/ronbar/Desktop/repo/datasets/drone-dataset-(uav)-DatasetNinja
      splits: [train, valid]
      ann_subdir: ann
      img_subdir: img
