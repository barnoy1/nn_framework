__include__: [
  '@REPO_ROOT/raw_models/RT-DETR/rtdetrv2_pytorch/configs/runtime.yml',
  '@REPO_ROOT/raw_models/RT-DETR/rtdetrv2_pytorch/configs/rtdetrv2/include/optimizer.yml',
  '@REPO_ROOT/raw_models/RT-DETR/rtdetrv2_pytorch/configs/rtdetrv2/include/rtdetrv2_r50vd.yml',
]

output_dir: ./output/rtdetrv2_r18vd_120e_coco_instance_seg_rle

PResNet:
  depth: 18
  in_channels: 3
  freeze_at: -1
  freeze_norm: False
  pretrained: True

HybridEncoder:
  in_channels: [128, 256, 512]
  hidden_dim: 256
  expansion: 0.5

RTDETRTransformerv2:
  num_layers: 3

epoches: 120

optimizer:
  type: AdamW
  params:
    -
      params: '^(?=.*(?:norm|bn)).*$'
      weight_decay: 0.

train_dataloader:
  dataset:
    transforms:
      policy:
        epoch: 117
  collate_fn:
    scales: ~
