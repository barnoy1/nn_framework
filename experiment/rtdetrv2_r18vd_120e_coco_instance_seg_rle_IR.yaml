# @package _global_

model:
  # Filesystem root of the concrete model repository implementation.
  source_root: raw_models/RT-DETR/rtdetrv2_pytorch
  # Baseline model recipe used by wrapper/model builder.
  model_config_path: configs/rtdetrv2/rtdetrv2_r18vd_120e_coco_instance_seg_rle_1ch.yml
  # Number of classifier outputs expected from the head.
  num_classes: 10
  # Number of object queries decoded per image.
  num_queries: 300
  # Transformer hidden channel width.
  hidden_dim: 256
  # Denoising groups for training stabilization.
  dn_num_group: 5
  # Enable SyncBatchNorm across devices in distributed setups.
  sync_bn: true

  losses:
    # Concrete criterion loss-to-coefficient pairing (used for optimization + reporting groups).
    # Grouping policy:
    #   - box / cls / dfl: core detection losses (generic defaults)
    #   - custom: model-specific losses under test (RT-DETRv2-specific variants)
    # Prefix entries (for example: loss_bbox_aux_) match all indexed losses like loss_bbox_aux_0, loss_bbox_aux_1, ...
    criterion_pairs:
      box:
        - loss: loss_bbox
          coef: 5.0
        - loss: loss_giou
          coef: 2.0
      cls:
        - loss: loss_vfl
          coef: 5.0
        - loss: loss_focal
          coef: 5.0
      dfl:
        - loss: loss_dfl
          coef: 1.0
      custom:
        # RT-DETRv2-specific auxiliary supervision variants.
        - loss: loss_bbox_aux_
          coef: 5.0
        - loss: loss_giou_aux_
          coef: 2.0
        - loss: loss_vfl_aux_
          coef: 5.0
        - loss: loss_focal_aux_
          coef: 5.0

        # RT-DETRv2-specific denoising supervision variants.
        - loss: loss_bbox_dn_
          coef: 5.0
        - loss: loss_giou_dn_
          coef: 2.0
        - loss: loss_vfl_dn_
          coef: 1.0
        - loss: loss_focal_dn_
          coef: 1.0

        # RT-DETRv2-specific encoder supervision variants.
        - loss: loss_bbox_enc_
          coef: 5.0
        - loss: loss_giou_enc_
          coef: 2.0
        - loss: loss_vfl_enc_
          coef: 5.0
        - loss: loss_focal_enc_
          coef: 5.0
      
    
train:
  # Total training epochs.
  epochs: 2
  # Per-step training batch size (kept small for 5-6GB GPUs).
  batch_size: 1
  # Per-step validation batch size.
  val_batch_size: 1
  # DataLoader worker processes.
  num_workers: 2
  # Base optimizer learning rate.
  lr: 0.00002
  # Multiplier applied to backbone LR relative to base LR.
  backbone_lr_multiplier: 0.1
  # L2 regularization strength.
  weight_decay: 0.0001
  # Gradient clipping norm threshold (0 disables).
  grad_clip_norm: 0.1
  # AMP mode (`fp16` reduces memory/latency).
  mixed_precision: "fp16"
  # Root directory for run artifacts.
  output_dir: ./out
  # Logging cadence in training steps.
  log_every_n_steps: 20
  # Validation cadence in epochs.
  val_every_n_epochs: 1
  # Checkpoint save cadence in epochs.
  save_every_n_epochs: 1
  # Enable Exponential Moving Average model weights.
  use_ema: true
  # EMA decay factor (higher = slower update).
  ema_decay: 0.9999
  # Warmup updates before full EMA behavior.
  ema_warmup_updates: 2000
  # Global random seed for reproducibility.
  seed: 42

data:
  # Skip samples with no valid annotations during training.
  filter_empty_targets: true
  # Keep segmentation in RLE format when mask tensors are not materialized.
  keep_rle_in_targets: true
  # High-level task mode.
  task: detection
  evaluator:
    # Evaluator backend.
    type: CocoEvaluator
    # IoU tasks to compute metrics for.
    iou_types: [bbox, segm]
  # Declared dataset class space size.
  num_classes: 10
  # Compatibility flag for COCO-style category remap paths.
  remap_mscoco_category: true
  mapping:
    # Map dataset contiguous class 0 -> model class index 4 (airplane).
    0: 4

  # Canonical mapping from class index to class name used by logs/visualization.
  label2classid: &label2classid {0: person, 1: bicycle, 2: car, 3: motorcycle, 4: airplane, 5: bus, 6: train, 7: truck, 8: boat, 9: traffic light}
  # Alias used by visualizers/inference output label rendering.
  class_id_to_name: *label2classid

  train_dataloader:
    # Loader implementation type.
    type: DataLoader
    dataset:
      # Dataset adapter type.
      type: CocoDetection
      datasets:
        # Training image directory.
        - img_folder: /home/ronbar/Desktop/repo/datasets/drone-dataset-(uav)-DatasetNinja/train/img
          # Training COCO annotation file.
          ann_file: /home/ronbar/Desktop/repo/datasets/drone-dataset-(uav)-DatasetNinja/instances_train.json
      # Ask dataset to prepare segmentation masks.
      return_masks: true
      transforms:
        # Transform container semantics.
        type: Compose
        ops:
          # Geometric: flips image + bboxes + masks.
          - {type: RandomHorizontalFlip, p: 0.5}
          # Geometric: vertical flip (synchronized with annotations).
          - {type: RandomVerticalFlip, p: 0.2}
          # Geometric: rotation in degrees range [-limit, +limit].
          - {type: Rotate, limit: 15, p: 0.3}
          # Convert VIS RGB input to IR-like single-channel intensity.
          - {type: ToGray, num_output_channels: 1, p: 1.0}
          # Local contrast equalization (thermal-like texture emphasis).
          - {type: CLAHE, clip_limit: 3.0, tile_grid_size: [8, 8], p: 0.6}
          # Global intensity/contrast variation for emissivity-like shifts.
          - {type: RandomBrightnessContrast, brightness_limit: 0.15, contrast_limit: 0.25, p: 0.5}
          # Gamma perturbation to mimic IR response curve changes.
          - {type: RandomGamma, gamma_limit: [70, 140], p: 0.4}
          # Sensor-like noise seen in thermal imagery.
          - {type: GaussNoise, var_limit: [8.0, 40.0], p: 0.35}
          # Slight optical/sensor blur.
          - {type: GaussianBlur, blur_limit: [3, 5], p: 0.2}
          # Final spatial normalization to model input size.
          - {type: Resize, size: [640, 640]}
          # Convert image to float tensor-like representation with scaling.
          - {type: ConvertPILImage, dtype: 'float32', scale: true}
          # Convert GT boxes to normalized cxcywh expected by model/loss.
          - {type: ConvertBoxes, fmt: 'cxcywh', normalize: true}
    # Shuffle training data each epoch.
    shuffle: true
    # Worker count for train loader.
    num_workers: 2
    # Global intended train batch size (framework-level metadata).
    total_batch_size: 1
    # Drop final incomplete batch for stable step math.
    drop_last: true
    collate_fn:
      # Batch collation strategy.
      type: BatchImageCollateFunction
      # Multi-scale training candidate sizes (bounded for VRAM stability).
      scales: [512, 544, 576, 608, 640]
    

  val_dataloader:
    # Loader implementation type.
    type: DataLoader
    dataset:
      # Dataset adapter type.
      type: CocoDetection
      datasets:
        # Validation image directory.
        - img_folder: /home/ronbar/Desktop/repo/datasets/drone-dataset-(uav)-DatasetNinja/valid/img
          # Validation COCO annotation file.
          ann_file: /home/ronbar/Desktop/repo/datasets/drone-dataset-(uav)-DatasetNinja/instances_valid.json
      # Keep masks available for segm evaluation.
      return_masks: true
      transforms:
        # Transform container semantics.
        type: Compose
        ops:
          # Deterministic resize for validation/inference parity.
          - {type: Resize, size: [640, 640]}
          # Deterministic VIS->IR-like conversion for eval/inference parity.
          - {type: ToGray, num_output_channels: 1, p: 1.0}
          # Convert image to scaled float representation.
          - {type: ConvertPILImage, dtype: 'float32', scale: true}
    # Keep deterministic order for reproducible eval.
    shuffle: false
    # Worker count for val loader.
    num_workers: 2
    # Global intended validation batch size (framework-level metadata).
    total_batch_size: 1
    # Keep tail batch for full-dataset evaluation coverage.
    drop_last: false
    collate_fn:
      # Batch collation strategy.
      type: BatchImageCollateFunction

runtime:
  common:
    # Runtime default output root.
    output_dir: out
    # Shared checkpoint path for train/eval/inference defaults.
    checkpoint: /home/ronbar/repo/nn_framework/raw_models/RT-DETR/rtdetrv2_pytorch/weights/rtdetrv2_r18vd_120e_coco_rerun_48.1.pth
    # Execution device.
    device: cuda
    # Generic runtime batch size used by utility flows.
    batch_size: 1
    # Generic runtime worker count.
    num_workers: 2
    # Hardware backend toggles.
    use_gpu: true
    use_xpu: false
    use_mlu: false
    use_npu: false
    # Iteration logging interval for runtime tools.
    log_iter: 20
    # Snapshot/checkpoint interval (runtime layer).
    snapshot_epoch: 1
    # Debug flags for model complexity reporting.
    print_flops: false
    print_params: false
    # Runtime epoch override.
    epoches: 2
    # Shared confidence threshold for evaluation metrics (train validation + eval flow).
    score_threshold: 0.3

  visualization:
    # Number of qualitative visualization samples to save.
    num_samples: 4
    # tensorboard logging directory for visualizations.
    tensorboard:
      # Enable TensorBoard logging for visualizations.
      enabled: false
      log_dir: visualization/tensorboard
    # mlflow logging configuration for visualizations.
    mlflow:
      # Enable MLflow logging for visualizations.
      enabled: true
      # Directory for mlflow tracking/artifacts for visualizations.
      mlflow_dir: visualization/mlflow

  data_preparation:
    # Whether to convert raw Supervisely-like data before training/eval.
    prepare_data: false
    # Source dataset root for conversion when enabled.
    supervisely_dataset_root: null
    # Splits to convert.
    supervisely_splits: [train, valid]
    # Annotation and image subfolder names in source dataset.
    ann_subdir: ann
    img_subdir: img
    # Optional experiment tracking hooks.
    mlflow_experiment_name: null
    mlflow_run_name: null

  export:
    # Apply postprocessing in export flow.
    post_process: true
    # Apply NMS in export flow.
    nms: true
    # Enable benchmark mode for export profiling.
    benchmark: false
    # Fuse Conv+BN prior to export when supported.
    fuse_conv_bn: false

  actions:
    # Train action parameters (empty uses defaults above).
    train: {}

    eval: {}

    inference:
      # Input directory for image inference.
      input_dir: /home/ronbar/repo/nn_framework/input_data

    inference_onnx:
      # ONNX model file for ONNX inference path.
      onnx_model: /home/ronbar/repo/nn_framework/raw_models/RT-DETR/rtdetrv2_pytorch/exported_models/model.onnx
      # Input directory for ONNX inference.
      input_dir: /home/ronbar/repo/nn_framework/input_data

    export_onnx:
      # Source checkpoint for ONNX export.
      checkpoint: /home/ronbar/repo/nn_framework/raw_models/RT-DETR/rtdetrv2_pytorch/weights/rtdetrv2_r18vd_120e_coco_rerun_48.1.pth
      # Destination ONNX path.
      onnx_model: /home/ronbar/repo/nn_framework/raw_models/RT-DETR/rtdetrv2_pytorch/exported_models/model.onnx

    export_coco_rle:
      # Dataset root for COCO-RLE conversion utility.
      dataset_root: /home/ronbar/Desktop/repo/datasets/drone-dataset-(uav)-DatasetNinja
      # Output directory for converted artifacts.
      output_dir: /home/ronbar/Desktop/repo/datasets/drone-dataset-(uav)-DatasetNinja
      # Splits to export.
      splits: [train, valid]
      # Annotation and image subfolder names for exporter.
      ann_subdir: ann
      img_subdir: img

