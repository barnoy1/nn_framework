train:
  epochs: 120
  batch_size: 8
  val_batch_size: 8
  num_workers: 4
  lr: 0.0002
  backbone_lr_multiplier: 1.25
  weight_decay: 0.0001
  grad_clip_norm: 0.1
  mixed_precision: fp16
  output_dir: ./nn_framework/outputs
  log_every_n_steps: 20
  val_every_n_epochs: 1
  save_every_n_epochs: 1
  use_ema: true
  ema_decay: 0.9999
  ema_warmup_updates: 2000
  seed: 42
