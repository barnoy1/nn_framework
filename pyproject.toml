[project]
name = "nn-framework"
version = "3.2.0"
requires-python = ">=3.10"

[tool.commitizen]
name = "cz_customize"
tag_format = "v$version"
version_scheme = "semver"
version_provider = "uv"
update_changelog_on_bump = true
changelog_file = "CHANGELOG.md"
template = ".cz_changelog.j2"

[tool.commitizen.customize]
schema = "<type>(<scope>): <subject>"
schema_pattern = "^(fix|feat|docs|style|refactor|perf|test|build|ci|chore)(\\([^)]+\\))?:\\s.+"
bump_pattern = "^(BREAKING CHANGE|feat|fix|docs|build|ci)"
change_type_order = ["BREAKING CHANGE", "feat", "fix", "refactor", "perf", "docs", "style", "test", "build", "ci", "chore"]
info = "Use conventional commits: <type>(<scope>): <subject>"
commit_parser = "^(?P<change_type>feat|fix|docs|style|refactor|perf|test|build|ci|chore)(?:\\((?P<scope>[^\\n()]+)\\))?: (?P<message>.+)?"
changelog_pattern = "^(feat|fix|docs|style|refactor|perf|test|build|ci|chore)(\\(.+\\))?!?:"
message_template = "{{change_type}}{% if scope %}({{scope}}){% endif %}: {{message}}{% if body %}\n\n{{body}}{% endif %}{% if footer %}\n\n{{footer}}{% endif %}"

[tool.commitizen.customize.bump_map]
"BREAKING CHANGE" = "MAJOR"
feat = "MINOR"
fix = "PATCH"
docs = "PATCH"
build = "PATCH"
ci = "PATCH"

[[tool.commitizen.customize.questions]]
type = "list"
name = "change_type"
message = "Select the type of change you are committing"
choices = [
	{ value = "fix", name = "fix: A bug fix. Correlates with PATCH in SemVer" },
	{ value = "feat", name = "feat: A new feature. Correlates with MINOR in SemVer" },
	{ value = "docs", name = "docs: Documentation only changes" },
	{ value = "style", name = "style: Changes that do not affect the meaning of the code" },
	{ value = "refactor", name = "refactor: A code change that neither fixes a bug nor adds a feature" },
	{ value = "perf", name = "perf: A code change that improves performance" },
	{ value = "test", name = "test: Adding missing or correcting existing tests" },
	{ value = "build", name = "build: Changes that affect the build system or dependencies" },
	{ value = "ci", name = "ci: Changes to CI configuration files and scripts" },
	{ value = "chore", name = "chore: Other changes that don't modify src or tests" },
]

[[tool.commitizen.customize.questions]]
type = "input"
name = "scope"
message = "What is the scope of this change? (class or file name)"

[[tool.commitizen.customize.questions]]
type = "input"
name = "message"
message = "Write a short and imperative summary of the code changes"

[[tool.commitizen.customize.questions]]
type = "input"
name = "body"
message = "Provide additional contextual information about the code changes"

[[tool.commitizen.customize.questions]]
type = "confirm"
name = "is_breaking"
message = "Is this a BREAKING CHANGE? Correlates with MAJOR in SemVer"
default = false
