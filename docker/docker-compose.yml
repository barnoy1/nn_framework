name: nn-framework

services:
  runner:
    container_name: nn-framework-runner
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: nn-framework-runner:local
    working_dir: /workspace
    environment:
      DISPLAY: ${DISPLAY:-:0}
      XAUTHORITY: /tmp/.Xauthority
    stdin_open: true
    tty: true
    shm_size: "${SHM_SIZE:-8gb}"
    volumes:
      - ../:/workspace
      - ../experiment:/workspace/experiments
      - ../docker/scripts:/workspace/scripts
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${XAUTHORITY:-/dev/null}:/tmp/.Xauthority:ro
      - /tmp:/tmp
      - ${HOME}/.cache/torch:/root/.cache/torch:rw
      - ${HOME}/repo/datasets:/root/repo/datasets:rw
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ports:
      - "${DEBUGPY_PORT:-5678}:${DEBUGPY_PORT:-5678}"
      - "${MLFLOW_PORT:-5000}:${MLFLOW_PORT:-5000}"